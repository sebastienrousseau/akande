name: regression

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
  schedule:
    # Daily at 04:11 UTC to catch upstream breakage early.
    - cron: "11 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fresh-install:
    name: Fresh install — Py ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: ["ubuntu-latest"]
        include:
          # One macOS row so PortAudio / PulseAudio surprises surface.
          - python-version: "3.12"
            os: "macos-14"
    steps:
      - uses: actions/checkout@v4

      - name: ❯ Set up Python ${{ matrix.python-version }} 🐍
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: ❯ Install system audio dependencies (Ubuntu) 🛠️
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-all-dev ffmpeg

      - name: ❯ Install system audio dependencies (macOS) 🛠️
        if: runner.os == 'macOS'
        run: |
          brew install portaudio ffmpeg

      - name: ❯ Run fresh-install regression 🔄
        run: ./scripts/regression.sh --keep-venv

      - name: ❯ Upload regression logs on failure 📤
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-logs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .regression-logs/
          if-no-files-found: ignore
