name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Python CI
    uses: sebastienrousseau/pipelines/.github/workflows/python-ci.yml@main
    with:
      python-version: '3.11'
      run-ruff: true
      run-mypy: true
      # Floor starts at 60 % to match v0.0.6-dev.1 reality.
      # Ratcheting toward 75 % by v0.0.6 GA — do not lower, only raise.
      coverage-threshold: 60
      package-manager: 'pip'
    secrets: inherit
