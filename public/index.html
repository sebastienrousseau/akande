<!DOCTYPE html>
<html lang="en-GB">

<head>
	<meta charset="utf-8" />
	<title>Akande</title>
	<meta content="Akande is a self-hosted AI voice assistant that delivers structured executive briefings."
		name="description">
	<meta content="no-referrer" name="referrer">
	<meta content="#f2f2f7" name="theme-color" id="themeColor">
	<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport">
	<link rel="icon" type="image/x-icon" href="https://kura.pro/akande/images/favicon.ico" sizes="16x16 32x32" />
	<style nonce="__CSP_NONCE__">
		/* ── Design Tokens ── */

		:root {
			--blue: #0056d6;
			--blue-hover: #004bb8;
			--blue-ring: rgba(0, 86, 214, 0.12);
			--bg-primary: #f2f2f7;
			--bg-secondary: #ffffff;
			--bg-tertiary: #f8f9fa;
			--surface-overlay: rgba(255,255,255,0.95);
			--border-primary: #d1d1d6;
			--border-secondary: #e5e5ea;
			--text-primary: #1c1c1e;
			--text-secondary: #6d6d78;
			--text-tertiary: #6d6d78;
			--text-on-filled: #ffffff;
			--text-on-filled-muted: rgba(255,255,255,0.7);
			--message-user: #0056d6;
			--message-assistant: #e5e5ea;
			--status-error: #ff3b30;
			--status-success: #30d158;
			--error-bg: #fff0f0;
			--pulse-ring: rgba(255, 59, 48, 0.35);
			--pulse-ring-out: rgba(255, 59, 48, 0);
			--scrim: rgba(0,0,0,0.4);
			--scrim-light: rgba(0,0,0,0.3);
			--shadow-modal: 0 1.25rem 3.75rem rgba(0,0,0,0.2);
			--shadow-menu: 0 0.5rem 1.5rem rgba(0,0,0,0.15);
			--space-xs: 0.25rem;
			--space-between: 0.375rem;
			--space-sm: 0.5rem;
			--space-md: 0.75rem;
			--space-lg: 1rem;
			--space-xl: 1.25rem;
			--space-2xl: 1.5rem;
			--radius-sm: 0.375rem;
			--radius-md: 0.5rem;
			--radius-lg: 0.875rem;
			--radius-xl: 1.25rem;
			--radius-tight: 0.3125rem;
			--radius-full: 50%;
			--border-thin: 0.5px;
			--border-regular: 1px;
			--focus-ring: 3.5px;
			--space-2xs: 0.125rem;
			--space-3xl: 2rem;
			--font-2xs: 0.6875rem;
			--font-xs: 0.75rem;
			--font-sm: 0.8125rem;
			--font-md: 0.875rem;
			--font-base: 0.9375rem;
			--font-lg: 1rem;
			--font-xl: 1.0625rem;
			--font-2xl: 1.5rem;
			--tracking-tight: -0.022em;
			--size-icon-sm: 0.75rem;
			--size-icon-md: 0.875rem;
			--size-icon: 1rem;
			--size-icon-lg: 1.75rem;
			--size-btn: 2.125rem;
			--size-dot: 0.4375rem;
			--space-item: 0.625rem;
			--space-micro: 0.1875rem;
			--blur-overlay: 20px;
			--outline-width: 2px;
			--content-max: 78%;
			--layout-desktop: 48rem;
			--modal-min: 17.5rem;
			--modal-max: 22.5rem;
			--menu-min: 10rem;
			--duration-fast: 100ms;
			--duration-normal: 150ms;
			--duration-slow: 180ms;
			--duration-enter: 200ms;
			--duration-sidebar: 250ms;
			--font-weight-normal: 400;
			--font-weight-semibold: 600;
			--font-weight-bold: 700;
			--sidebar-width: 18.75rem;
			--duration-dot: 1.4s;
			--duration-stagger-1: 0.16s;
			--duration-stagger-2: 0.32s;
			--saturate-overlay: 180%;
			--scale-press: 0.9;
			--scale-msg-enter: 0.98;
			--scale-modal-enter: 0.95;
			--scale-dot-min: 0.5;
			--opacity-dot-min: 0.35;
			--opacity-reduced-dot: 0.6;
			--opacity-disabled: 0.7;
			--z-skip: 9999;
			--z-header: 100;
			--z-sidebar-backdrop: 199;
			--z-sidebar: 200;
			--z-modal: 500;
			--z-context: 600;
			--leading-message: 1.45;
			--leading-input: 1.4;
			--content-desktop: 70%;
			--modal-width: 90%;
			--opacity-hidden: 0;
			--opacity-visible: 1;
			--scale-hidden: 0;
			--scale-identity: 1;
			--position-center: 50%;
			--translate-center: -50%;
			--translate-offscreen: -100%;
			--font: -apple-system, BlinkMacSystemFont, "SF Pro Text",
				"Helvetica Neue", system-ui, sans-serif;
		}

		:root.dark {
			--bg-primary: #1c1c1e;
			--bg-secondary: #2c2c2e;
			--bg-tertiary: #3a3a3c;
			--surface-overlay: rgba(28,28,30,0.95);
			--border-primary: #48484a;
			--border-secondary: #38383a;
			--text-primary: #f5f5f7;
			--text-secondary: #98989d;
			--text-tertiary: #636366;
			--text-on-filled: #ffffff;
			--text-on-filled-muted: rgba(255,255,255,0.7);
			--message-user: #0a84ff;
			--message-assistant: #3a3a3c;
			--status-error: #ff453a;
			--status-success: #32d74b;
			--error-bg: #3a2020;
			--blue: #0a84ff;
			--blue-hover: #0070e6;
			--blue-ring: rgba(10, 132, 255, 0.15);
			--pulse-ring: rgba(255, 69, 58, 0.35);
			--pulse-ring-out: rgba(255, 69, 58, 0);
			--scrim: rgba(0,0,0,0.55);
			--scrim-light: rgba(0,0,0,0.4);
			--shadow-modal: 0 1.25rem 3.75rem rgba(0,0,0,0.4);
			--shadow-menu: 0 0.5rem 1.5rem rgba(0,0,0,0.3);
		}

		/* ── Reset ── */

		*, *::before, *::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html, body {
			height: 100%;
			font-family: var(--font);
			-webkit-font-smoothing: antialiased;
			background: var(--bg-primary);
			color: var(--text-primary);
			transition: background-color var(--duration-slow) ease, color var(--duration-slow) ease;
		}

		body {
			display: flex;
			overflow: hidden;
		}

		/* ── Skip link ── */

		.skip-link {
			position: absolute;
			top: var(--translate-offscreen);
			left: var(--space-sm);
			background: var(--blue);
			color: var(--text-on-filled);
			padding: var(--space-sm) var(--space-lg);
			border-radius: var(--radius-xl);
			z-index: var(--z-skip);
			text-decoration: none;
			font-size: var(--font-sm);
		}
		.skip-link:focus { top: var(--space-sm); }

		/* ── App Layout (sidebar + main) ── */

		.app {
			display: flex;
			width: 100%;
			height: 100%;
		}

		/* ── Sidebar ── */

		.sidebar {
			width: var(--sidebar-width);
			min-width: var(--sidebar-width);
			height: 100%;
			background: var(--bg-secondary);
			border-right: var(--border-thin) solid var(--border-primary);
			display: flex;
			flex-direction: column;
			transition: transform var(--duration-sidebar) ease-out, background-color var(--duration-slow) ease;
		}

		.sidebar-header {
			padding: var(--space-md);
			border-bottom: var(--border-thin) solid var(--border-secondary);
			display: flex;
			flex-direction: column;
			gap: var(--space-sm);
		}

		.sidebar-header-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		.sidebar-title {
			font-size: var(--font-xl);
			font-weight: var(--font-weight-bold);
			letter-spacing: var(--tracking-tight);
		}

		.sidebar-actions {
			display: flex;
			gap: var(--space-xs);
		}

		.icon-btn {
			width: var(--size-icon-lg);
			height: var(--size-icon-lg);
			border-radius: var(--radius-sm);
			border: none;
			background: transparent;
			color: var(--blue);
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: background-color var(--duration-fast) ease;
			flex-shrink: 0;
		}

		.icon-btn:hover {
			background: var(--bg-tertiary);
		}

		.icon-btn svg {
			width: var(--size-icon);
			height: var(--size-icon);
			fill: currentColor;
		}

		/* Search */

		.search-box {
			position: relative;
		}

		.search-input {
			width: 100%;
			border: var(--border-regular) solid var(--border-secondary);
			border-radius: var(--radius-md);
			padding: var(--space-xs) var(--space-sm) var(--space-xs) var(--size-icon-lg);
			font-size: var(--font-sm);
			font-family: var(--font);
			background: var(--bg-tertiary);
			color: var(--text-primary);
			outline: none;
			transition: border-color var(--duration-normal) ease, box-shadow var(--duration-normal) ease,
				background-color var(--duration-slow) ease;
		}

		.search-input::placeholder {
			color: var(--text-tertiary);
		}

		.search-icon {
			position: absolute;
			left: var(--space-sm);
			top: var(--position-center);
			transform: translateY(var(--translate-center));
			width: var(--size-icon-sm);
			height: var(--size-icon-sm);
			fill: var(--text-tertiary);
			pointer-events: none;
		}

		/* Conversation list */

		.conversation-list {
			flex: 1;
			overflow-y: auto;
			-webkit-overflow-scrolling: touch;
		}

		.conv-item {
			display: flex;
			flex-direction: column;
			padding: var(--space-item) var(--space-md);
			cursor: pointer;
			border-bottom: var(--border-thin) solid var(--border-secondary);
			transition: background-color var(--duration-fast) ease;
		}

		.conv-item:hover {
			background: var(--bg-tertiary);
		}

		.conv-item.active {
			background: var(--blue);
			color: var(--text-on-filled);
		}

		.conv-item.active .conv-preview,
		.conv-item.active .conv-time {
			color: var(--text-on-filled-muted);
		}

		.conv-item-header {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			gap: var(--space-sm);
		}

		.conv-title {
			font-size: var(--font-md);
			font-weight: var(--font-weight-semibold);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			flex: 1;
			min-width: 0;
		}

		.conv-time {
			font-size: var(--font-2xs);
			color: var(--text-tertiary);
			flex-shrink: 0;
		}

		.conv-preview {
			font-size: var(--font-xs);
			color: var(--text-secondary);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			margin-top: var(--space-2xs);
		}

		/* Sidebar footer */

		.sidebar-footer {
			padding: var(--space-sm) var(--space-md);
			border-top: var(--border-thin) solid var(--border-secondary);
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		.theme-toggle {
			font-size: var(--font-xs);
			color: var(--text-secondary);
			background: none;
			border: none;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: var(--space-between);
			padding: var(--space-xs) var(--space-sm);
			border-radius: var(--radius-sm);
			transition: background-color var(--duration-fast) ease, color var(--duration-slow) ease;
			font-family: var(--font);
		}

		.theme-toggle:hover {
			background: var(--bg-tertiary);
			color: var(--text-primary);
		}

		.theme-toggle svg {
			width: var(--size-icon-md);
			height: var(--size-icon-md);
			fill: currentColor;
		}

		/* ── Main panel ── */

		.main {
			flex: 1;
			display: flex;
			flex-direction: column;
			min-width: 0;
			background: var(--bg-primary);
			transition: background-color var(--duration-slow) ease;
		}

		/* Main header */

		.main-header {
			position: sticky;
			top: 0;
			z-index: var(--z-header);
			background: var(--surface-overlay);
			backdrop-filter: saturate(var(--saturate-overlay)) blur(var(--blur-overlay));
			-webkit-backdrop-filter: saturate(var(--saturate-overlay)) blur(var(--blur-overlay));
			border-bottom: var(--border-thin) solid var(--border-primary);
			padding: var(--space-md) var(--space-lg);
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: var(--space-sm);
			transition: background-color var(--duration-slow) ease;
		}

		.main-header-left {
			display: flex;
			align-items: center;
			gap: var(--space-sm);
			min-width: 0;
		}

		.sidebar-toggle {
			display: none;
		}

		.main-title {
			font-size: var(--font-xl);
			font-weight: var(--font-weight-semibold);
			letter-spacing: var(--tracking-tight);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.main-header-actions {
			display: flex;
			gap: var(--space-xs);
			flex-shrink: 0;
		}

		/* ── Chat area ── */

		.chat-area {
			flex: 1;
			overflow-y: auto;
			-webkit-overflow-scrolling: touch;
			padding: var(--space-lg) var(--space-lg) var(--space-sm);
			display: flex;
			flex-direction: column;
		}

		/* Welcome */

		.welcome {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			gap: var(--space-between);
		}

		.welcome h2 {
			font-size: var(--font-2xl);
			font-weight: var(--font-weight-semibold);
			letter-spacing: var(--tracking-tight);
		}

		.welcome p {
			font-size: var(--font-base);
			color: var(--text-secondary);
		}

		.welcome.hidden { display: none; }

		/* Messages */

		.message {
			max-width: var(--content-max);
			padding: var(--space-item) var(--font-base);
			margin-bottom: var(--space-micro);
			font-size: var(--font-base);
			line-height: var(--leading-message);
			word-wrap: break-word;
			white-space: pre-wrap;
			animation: msgAppear var(--duration-enter) ease-out both;
		}

		@keyframes msgAppear {
			from { opacity: var(--opacity-hidden); transform: translateY(var(--space-sm)) scale(var(--scale-msg-enter)); }
			to   { opacity: var(--opacity-visible); transform: translateY(0) scale(var(--scale-identity)); }
		}

		@media (prefers-reduced-motion: reduce) {
			.message {
				animation: msgFade var(--duration-fast) ease both;
			}
			@keyframes msgFade {
				from { opacity: var(--opacity-hidden); }
				to   { opacity: var(--opacity-visible); }
			}
			.sidebar {
				transition: none;
			}
			.mic-btn.recording {
				animation: none;
			}
			.typing span {
				animation: none;
				opacity: var(--opacity-reduced-dot);
			}
			.send-btn,
			.btn-circle,
			.icon-btn {
				transition: none;
			}
		}

		.message.user {
			align-self: flex-end;
			background: var(--message-user);
			color: var(--text-on-filled);
			border-radius: var(--radius-xl) var(--radius-xl) var(--radius-tight) var(--radius-xl);
			margin-top: var(--space-md);
		}

		.message.assistant {
			align-self: flex-start;
			background: var(--message-assistant);
			color: var(--text-primary);
			border-radius: var(--radius-xl) var(--radius-xl) var(--radius-xl) var(--radius-tight);
		}

		.message.error {
			align-self: flex-start;
			background: var(--error-bg);
			color: var(--status-error);
			border-radius: var(--radius-xl);
			font-size: var(--font-md);
		}

		/* Typing indicator */

		.typing {
			align-self: flex-start;
			background: var(--message-assistant);
			border-radius: var(--radius-xl);
			padding: var(--font-2xs) var(--space-lg);
			display: none;
			gap: var(--space-between);
			margin-top: var(--space-between);
			animation: msgAppear var(--duration-enter) ease-out both;
		}

		.typing.visible { display: flex; }

		.typing span {
			width: var(--size-dot);
			height: var(--size-dot);
			border-radius: var(--radius-full);
			background: var(--text-secondary);
			animation: dot var(--duration-dot) ease-in-out infinite both;
		}
		.typing span:nth-child(2) { animation-delay: var(--duration-stagger-1); }
		.typing span:nth-child(3) { animation-delay: var(--duration-stagger-2); }

		@keyframes dot {
			0%, 80%, 100% { transform: scale(var(--scale-dot-min)); opacity: var(--opacity-dot-min); }
			40%            { transform: scale(var(--scale-identity));   opacity: var(--opacity-visible); }
		}

		/* ── Input bar ── */

		.input-bar {
			position: sticky;
			bottom: 0;
			z-index: var(--z-header);
			background: var(--surface-overlay);
			backdrop-filter: saturate(var(--saturate-overlay)) blur(var(--blur-overlay));
			-webkit-backdrop-filter: saturate(var(--saturate-overlay)) blur(var(--blur-overlay));
			border-top: var(--border-thin) solid var(--border-primary);
			padding: var(--space-sm) var(--space-item);
			padding-bottom: max(var(--space-sm), env(safe-area-inset-bottom));
			display: flex;
			align-items: center;
			gap: var(--space-between);
			transition: background-color var(--duration-slow) ease;
		}

		.btn-circle {
			flex-shrink: 0;
			width: var(--size-btn);
			height: var(--size-btn);
			border-radius: var(--radius-full);
			border: none;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: background var(--duration-slow) ease, transform var(--duration-slow) ease,
				opacity var(--duration-slow) ease;
		}

		.btn-circle:active { transform: scale(var(--scale-press)); }

		.btn-circle svg {
			width: var(--size-icon);
			height: var(--size-icon);
			fill: currentColor;
		}

		.mic-btn {
			background: transparent;
			color: var(--text-secondary);
		}
		.mic-btn:hover { color: var(--text-primary); }
		.mic-btn.recording {
			background: var(--status-error);
			color: var(--text-on-filled);
			animation: pulse var(--duration-dot) ease-in-out infinite;
		}

		@keyframes pulse {
			0%, 100% { box-shadow: 0 0 0 0 var(--pulse-ring); }
			50%       { box-shadow: 0 0 0 var(--size-dot) var(--pulse-ring-out); }
		}

		.send-btn {
			background: var(--blue);
			color: var(--text-on-filled);
			transform: scale(var(--scale-hidden));
			opacity: var(--opacity-hidden);
		}
		.send-btn.visible {
			transform: scale(var(--scale-identity));
			opacity: var(--opacity-visible);
		}
		.send-btn:hover { background: var(--blue-hover); }

		.text-input {
			flex: 1;
			min-width: 0;
			border: var(--border-regular) solid var(--border-primary);
			border-radius: var(--radius-xl);
			padding: var(--size-dot) var(--size-icon-md);
			font-size: var(--font-lg);
			font-family: var(--font);
			line-height: var(--leading-input);
			background: var(--bg-secondary);
			color: var(--text-primary);
			outline: none;
			transition: border-color var(--duration-normal) ease, box-shadow var(--duration-normal) ease,
				background-color var(--duration-slow) ease;
			-webkit-appearance: none;
		}

		.text-input:disabled { background: var(--bg-primary); opacity: var(--opacity-disabled); }
		.text-input::placeholder { color: var(--text-tertiary); }

		/* ── Export / Context menu modal ── */

		.modal-overlay {
			position: fixed;
			inset: 0;
			background: var(--scrim);
			z-index: var(--z-modal);
			display: none;
			align-items: center;
			justify-content: center;
			animation: fadeIn var(--duration-normal) ease;
		}

		.modal-overlay.visible {
			display: flex;
		}

		@keyframes fadeIn {
			from { opacity: var(--opacity-hidden); }
			to   { opacity: var(--opacity-visible); }
		}

		.modal {
			background: var(--bg-secondary);
			border-radius: var(--radius-lg);
			padding: var(--space-xl);
			min-width: var(--modal-min);
			max-width: var(--modal-max);
			width: var(--modal-width);
			box-shadow: var(--shadow-modal);
			animation: modalIn var(--duration-enter) ease-out;
			transition: background-color var(--duration-slow) ease;
		}

		@keyframes modalIn {
			from { opacity: var(--opacity-hidden); transform: scale(var(--scale-modal-enter)); }
			to   { opacity: var(--opacity-visible); transform: scale(var(--scale-identity)); }
		}

		@media (prefers-reduced-motion: reduce) {
			.modal-overlay, .modal {
				animation: none;
			}
		}

		.modal h3 {
			font-size: var(--font-lg);
			font-weight: var(--font-weight-semibold);
			margin-bottom: var(--space-md);
		}

		.modal-btn {
			display: block;
			width: 100%;
			padding: var(--space-item) var(--space-md);
			border: var(--border-regular) solid var(--border-secondary);
			border-radius: var(--radius-md);
			background: var(--bg-tertiary);
			color: var(--text-primary);
			font-size: var(--font-md);
			font-family: var(--font);
			cursor: pointer;
			text-align: left;
			margin-bottom: var(--space-sm);
			transition: background-color var(--duration-fast) ease;
		}

		.modal-btn:hover {
			background: var(--border-secondary);
		}

		.modal-btn.danger {
			color: var(--status-error);
			border-color: var(--status-error);
		}

		.modal-btn.danger:hover {
			background: var(--error-bg);
		}

		.modal-cancel {
			display: block;
			width: 100%;
			padding: var(--space-sm);
			border: none;
			background: transparent;
			color: var(--blue);
			font-size: var(--font-md);
			font-family: var(--font);
			cursor: pointer;
			margin-top: var(--space-xs);
		}

		/* ── Empty state ── */

		.empty-state {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			color: var(--text-tertiary);
			font-size: var(--font-sm);
			text-align: center;
			padding: var(--space-3xl);
		}

		/* ── Responsive ── */

		/* Breakpoint: 768px -- var() not permitted in @media per CSS spec */
		@media (max-width: 768px) {
			.sidebar {
				position: fixed;
				top: 0;
				left: 0;
				bottom: 0;
				z-index: var(--z-sidebar);
				transform: translateX(var(--translate-offscreen));
			}

			.sidebar.open {
				transform: translateX(0);
			}

			.sidebar-backdrop {
				position: fixed;
				inset: 0;
				background: var(--scrim-light);
				z-index: var(--z-sidebar-backdrop);
				display: none;
			}

			.sidebar-backdrop.visible {
				display: block;
			}

			.sidebar-toggle {
				display: flex;
			}
		}

		@media (min-width: 769px) {
			.chat-area {
				max-width: var(--layout-desktop);
				width: 100%;
				margin: 0 auto;
				padding: var(--space-xl) var(--space-2xl) var(--space-sm);
			}
			.input-bar {
				max-width: var(--layout-desktop);
				margin: 0 auto;
			}
			.message { max-width: var(--content-desktop); }
		}

		/* ── Context menu ── */

		.context-menu {
			position: fixed;
			z-index: var(--z-context);
			background: var(--bg-secondary);
			border: var(--border-regular) solid var(--border-primary);
			border-radius: var(--radius-md);
			box-shadow: var(--shadow-menu);
			min-width: var(--menu-min);
			padding: var(--space-xs) 0;
			display: none;
		}

		.context-menu.visible {
			display: block;
		}

		.context-menu button {
			display: block;
			width: 100%;
			padding: var(--space-sm) var(--space-md);
			border: none;
			background: transparent;
			color: var(--text-primary);
			font-size: var(--font-sm);
			font-family: var(--font);
			text-align: left;
			cursor: pointer;
		}

		.context-menu button:hover {
			background: var(--bg-tertiary);
		}

		.context-menu button.danger {
			color: var(--status-error);
		}

		/* ── Focus indicators (WCAG 2.4.7) ── */

		.icon-btn:focus-visible {
			outline: var(--outline-width) solid var(--blue);
			outline-offset: var(--outline-width);
		}

		.conv-item:focus-visible {
			outline: var(--outline-width) solid var(--blue);
			outline-offset: calc(-1 * var(--outline-width));
		}

		.theme-toggle:focus-visible {
			outline: var(--outline-width) solid var(--blue);
			outline-offset: var(--outline-width);
		}

		.modal-btn:focus-visible,
		.modal-cancel:focus-visible {
			outline: var(--outline-width) solid var(--blue);
			outline-offset: var(--outline-width);
		}

		.btn-circle:focus-visible {
			outline: var(--outline-width) solid var(--blue);
			outline-offset: var(--outline-width);
		}

		.context-menu button:focus-visible {
			outline: var(--outline-width) solid var(--blue);
			outline-offset: calc(-1 * var(--outline-width));
			background: var(--bg-tertiary);
		}

		.search-input:focus-visible {
			outline: var(--outline-width) solid var(--blue);
			outline-offset: calc(-1 * var(--outline-width));
			box-shadow: 0 0 0 var(--focus-ring) var(--blue-ring);
		}

		.text-input:focus-visible {
			outline: var(--outline-width) solid var(--blue);
			outline-offset: calc(-1 * var(--outline-width));
			box-shadow: 0 0 0 var(--focus-ring) var(--blue-ring);
		}
	</style>
</head>

<body>
	<a href="#chat-input" class="skip-link">Skip to input</a>

	<div class="app" role="application" aria-label="Akande Chat Application">

		<!-- Sidebar backdrop for mobile -->
		<div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

		<!-- Sidebar -->
		<nav class="sidebar" id="sidebar" aria-label="Conversations">
			<div class="sidebar-header">
				<div class="sidebar-header-row">
					<span class="sidebar-title">Akande</span>
					<div class="sidebar-actions">
						<button type="button" class="icon-btn" id="newChatBtn"
							aria-label="New conversation" title="New conversation">
							<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
						</button>
					</div>
				</div>
				<div class="search-box">
					<svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
					<input type="search" class="search-input" id="searchInput"
						placeholder="Search conversations..." aria-label="Search conversations" />
				</div>
			</div>

			<div class="conversation-list" id="convList" role="listbox"
				aria-label="Conversation list">
				<!-- populated by JS -->
			</div>

			<div class="sidebar-footer">
				<button type="button" class="theme-toggle" id="themeToggle"
					aria-label="Switch theme">
					<svg id="themeIconSun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 18a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1zm9-9a1 1 0 0 1 0 2h-1a1 1 0 1 1 0-2h1zM4 11a1 1 0 0 1 0 2H3a1 1 0 1 1 0-2h1zm14.36-5.64a1 1 0 0 1 0 1.41l-.7.71a1 1 0 1 1-1.42-1.42l.71-.7a1 1 0 0 1 1.41 0zM7.05 16.95a1 1 0 0 1 0 1.41l-.7.71a1 1 0 1 1-1.42-1.42l.71-.7a1 1 0 0 1 1.41 0zm11.31 0a1 1 0 0 1 0 1.41l-.7.71a1 1 0 1 1-1.42-1.42l.71-.7a1 1 0 0 1 1.41 0zM7.05 5.36a1 1 0 0 1 0 1.41l-.7.71A1 1 0 1 1 4.93 6.06l.71-.7a1 1 0 0 1 1.41 0z"/></svg>
					<svg id="themeIconMoon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8C13.06 3.04 12.54 3 12 3z"/></svg>
					<span id="themeLabel">Dark mode</span>
				</button>
				<span style="font-size:var(--font-2xs);color:var(--text-tertiary)" id="convCount"></span>
			</div>
		</nav>

		<!-- Main panel -->
		<div class="main">
			<header class="main-header">
				<div class="main-header-left">
					<button type="button" class="icon-btn sidebar-toggle" id="sidebarToggle"
						aria-label="Open conversations">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
					</button>
					<h1 class="main-title" id="mainTitle">Akande</h1>
				</div>
				<div class="main-header-actions">
					<button type="button" class="icon-btn" id="exportBtn"
						aria-label="Export conversation" title="Export conversation">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
					</button>
					<button type="button" class="icon-btn" id="moreBtn"
						aria-label="More options" title="More options">
						<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
					</button>
				</div>
			</header>

			<div class="chat-area" id="chatArea" role="log"
				aria-live="polite" aria-label="Conversation messages">
				<div class="welcome" id="welcome">
					<h2>Akande</h2>
					<p>Type a question below or tap the microphone to ask by voice.</p>
				</div>

				<div class="typing" id="typing" aria-live="polite"
					aria-label="AI is responding">
					<span></span><span></span><span></span>
				</div>
			</div>

			<div class="input-bar">
				<button type="button" class="btn-circle mic-btn" id="micBtn"
					aria-label="Record voice question" aria-pressed="false">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm-1-9a1 1 0 1 1 2 0v6a1 1 0 1 1-2 0V5zm6 6a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V20H8v2h8v-2h-3v-2.07A7 7 0 0 0 19 11h-2z"/></svg>
				</button>

				<input type="text" class="text-input" id="chat-input"
					placeholder="Ask me anything..." autocomplete="off"
					aria-label="Type your question" />

				<button type="button" class="btn-circle send-btn" id="sendBtn"
					aria-label="Send">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
				</button>
			</div>
		</div>
	</div>

	<!-- Export modal -->
	<div class="modal-overlay" id="exportModal" role="dialog"
		aria-modal="true" aria-labelledby="exportModalTitle">
		<div class="modal">
			<h3 id="exportModalTitle">Export Conversation</h3>
			<button type="button" class="modal-btn" id="exportPdf">
				Export as PDF
			</button>
			<button type="button" class="modal-btn" id="exportCsv">
				Export as CSV
			</button>
			<button type="button" class="modal-cancel" id="exportCancel">
				Cancel
			</button>
		</div>
	</div>

	<!-- Context menu -->
	<div class="context-menu" id="contextMenu" role="menu">
		<button type="button" role="menuitem" id="ctxRename">Rename</button>
		<button type="button" role="menuitem" id="ctxExport">Export</button>
		<button type="button" role="menuitem" class="danger" id="ctxDelete">Delete</button>
	</div>

	<noscript>
		<style>.input-bar,.typing,.sidebar{display:none}.welcome p::after{content:" JavaScript is required for interactive features.";font-weight:600}</style>
	</noscript>

	<script nonce="__CSP_NONCE__">
		'use strict';

		(function () {

			/* ── DOM refs ── */
			var chatArea = document.getElementById('chatArea');
			var welcome = document.getElementById('welcome');
			var typing = document.getElementById('typing');
			var input = document.getElementById('chat-input');
			var sendBtn = document.getElementById('sendBtn');
			var micBtn = document.getElementById('micBtn');
			var sidebar = document.getElementById('sidebar');
			var sidebarBackdrop = document.getElementById('sidebarBackdrop');
			var sidebarToggle = document.getElementById('sidebarToggle');
			var newChatBtn = document.getElementById('newChatBtn');
			var searchInput = document.getElementById('searchInput');
			var convList = document.getElementById('convList');
			var mainTitle = document.getElementById('mainTitle');
			var exportBtn = document.getElementById('exportBtn');
			var exportModal = document.getElementById('exportModal');
			var exportPdf = document.getElementById('exportPdf');
			var exportCsv = document.getElementById('exportCsv');
			var exportCancel = document.getElementById('exportCancel');
			var moreBtn = document.getElementById('moreBtn');
			var contextMenu = document.getElementById('contextMenu');
			var ctxRename = document.getElementById('ctxRename');
			var ctxExport = document.getElementById('ctxExport');
			var ctxDelete = document.getElementById('ctxDelete');
			var themeToggle = document.getElementById('themeToggle');
			var themeLabel = document.getElementById('themeLabel');
			var themeIconSun = document.getElementById('themeIconSun');
			var themeIconMoon = document.getElementById('themeIconMoon');
			var themeColor = document.getElementById('themeColor');
			var convCount = document.getElementById('convCount');

			var isProcessing = false;
			var mediaRecorder = null;
			var audioStream = null;
			var recordTimer = null;
			var RECORD_MAX = 10;
			var ctxConvId = null;

			/* ── Storage ── */

			var STORE_KEY = 'akande_conversations';

			function loadConversations() {
				try {
					return JSON.parse(localStorage.getItem(STORE_KEY)) || [];
				} catch (_) { return []; }
			}

			function saveConversations(convs) {
				try {
					localStorage.setItem(STORE_KEY, JSON.stringify(convs));
				} catch (_) {}
			}

			function genId() {
				return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
			}

			var conversations = loadConversations();
			var activeConvId = null;

			/* ── Theme ── */

			function getTheme() {
				return localStorage.getItem('akande_theme') || 'light';
			}

			function applyTheme(t) {
				var isDark = t === 'dark';
				document.documentElement.classList.toggle('dark', isDark);
				themeIconSun.style.display = isDark ? 'none' : '';
				themeIconMoon.style.display = isDark ? '' : 'none';
				themeLabel.textContent = isDark ? 'Light mode' : 'Dark mode';
				themeToggle.setAttribute('aria-label',
					isDark ? 'Switch to light theme' : 'Switch to dark theme');
				themeColor.setAttribute('content', isDark ? '#1c1c1e' : '#f2f2f7');
				localStorage.setItem('akande_theme', t);
			}

			applyTheme(getTheme());

			themeToggle.addEventListener('click', function () {
				applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
			});

			/* ── Sidebar toggle (mobile) ── */

			function openSidebar() {
				sidebar.classList.add('open');
				sidebarBackdrop.classList.add('visible');
			}

			function closeSidebar() {
				sidebar.classList.remove('open');
				sidebarBackdrop.classList.remove('visible');
			}

			sidebarToggle.addEventListener('click', openSidebar);
			sidebarBackdrop.addEventListener('click', closeSidebar);

			/* ── Conversation list rendering ── */

			function timeAgo(ts) {
				var diff = Date.now() - ts;
				var s = Math.floor(diff / 1000);
				if (s < 60) return 'now';
				var m = Math.floor(s / 60);
				if (m < 60) return m + 'm';
				var h = Math.floor(m / 60);
				if (h < 24) return h + 'h';
				var d = Math.floor(h / 24);
				if (d < 7) return d + 'd';
				return new Date(ts).toLocaleDateString();
			}

			function renderConvList(filter) {
				var q = (filter || '').toLowerCase();
				convList.innerHTML = '';
				var filtered = conversations.filter(function (c) {
					if (!q) return true;
					if (c.title.toLowerCase().includes(q)) return true;
					return c.messages.some(function (m) {
						return m.content.toLowerCase().includes(q);
					});
				});

				if (!filtered.length) {
					var empty = document.createElement('div');
					empty.className = 'empty-state';
					empty.textContent = q
						? 'No matching conversations.'
						: 'No conversations yet.';
					convList.appendChild(empty);
				}

				filtered.forEach(function (c) {
					var item = document.createElement('div');
					item.className = 'conv-item' + (c.id === activeConvId ? ' active' : '');
					item.setAttribute('role', 'option');
					item.setAttribute('aria-selected', c.id === activeConvId ? 'true' : 'false');
					item.setAttribute('tabindex', '0');

					var lastMsg = c.messages.length
						? c.messages[c.messages.length - 1]
						: null;

					item.innerHTML =
						'<div class="conv-item-header">' +
							'<span class="conv-title">' + escHtml(c.title) + '</span>' +
							'<span class="conv-time">' + timeAgo(c.updatedAt) + '</span>' +
						'</div>' +
						'<div class="conv-preview">' +
							(lastMsg ? escHtml(lastMsg.content.slice(0, 60)) : 'Empty') +
						'</div>';

					item.addEventListener('click', function () {
						switchConversation(c.id);
						closeSidebar();
					});

					item.addEventListener('keydown', function (e) {
						if (e.key === 'Enter' || e.key === ' ') {
							e.preventDefault();
							switchConversation(c.id);
							closeSidebar();
						}
						if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) {
							e.preventDefault();
							var rect = item.getBoundingClientRect();
							showContextMenu({
								clientX: rect.left + rect.width / 2,
								clientY: rect.top + rect.height / 2
							}, c.id);
						}
					});

					item.addEventListener('contextmenu', function (e) {
						e.preventDefault();
						showContextMenu(e, c.id);
					});

					convList.appendChild(item);
				});

				convCount.textContent = conversations.length + ' conversation' +
					(conversations.length !== 1 ? 's' : '');
			}

			function escHtml(s) {
				var d = document.createElement('div');
				d.textContent = s;
				return d.innerHTML;
			}

			/* ── Conversation management ── */

			function createConversation() {
				var conv = {
					id: genId(),
					title: 'New Conversation',
					messages: [],
					createdAt: Date.now(),
					updatedAt: Date.now()
				};
				conversations.unshift(conv);
				saveConversations(conversations);
				switchConversation(conv.id);
				renderConvList(searchInput.value);
				return conv;
			}

			function getConversation(id) {
				return conversations.find(function (c) { return c.id === id; });
			}

			function switchConversation(id) {
				activeConvId = id;
				var conv = getConversation(id);
				if (!conv) return;

				mainTitle.textContent = conv.title;
				renderMessages(conv);
				renderConvList(searchInput.value);
				input.focus();
			}

			function renderMessages(conv) {
				// Clear existing messages but keep welcome and typing
				var existing = chatArea.querySelectorAll('.message');
				existing.forEach(function (el) { el.remove(); });

				if (!conv.messages.length) {
					welcome.classList.remove('hidden');
					welcome.style.display = '';
				} else {
					welcome.classList.add('hidden');
					conv.messages.forEach(function (m) {
						var el = document.createElement('div');
						el.className = 'message ' + m.role;
						el.textContent = m.content;
						chatArea.insertBefore(el, typing);
					});
					scrollToBottom();
				}
			}

			function deleteConversation(id) {
				conversations = conversations.filter(function (c) {
					return c.id !== id;
				});
				saveConversations(conversations);
				if (activeConvId === id) {
					if (conversations.length) {
						switchConversation(conversations[0].id);
					} else {
						activeConvId = null;
						mainTitle.textContent = 'Akande';
						var existing = chatArea.querySelectorAll('.message');
						existing.forEach(function (el) { el.remove(); });
						welcome.classList.remove('hidden');
						welcome.style.display = '';
					}
				}
				renderConvList(searchInput.value);
			}

			function renameConversation(id) {
				var conv = getConversation(id);
				if (!conv) return;
				var name = prompt('Rename conversation:', conv.title);
				if (name && name.trim()) {
					conv.title = name.trim().slice(0, 100);
					conv.updatedAt = Date.now();
					saveConversations(conversations);
					if (activeConvId === id) {
						mainTitle.textContent = conv.title;
					}
					renderConvList(searchInput.value);
				}
			}

			/* ── Init: load or create first conversation ── */

			if (conversations.length) {
				switchConversation(conversations[0].id);
			} else {
				createConversation();
			}
			renderConvList('');

			/* ── New chat button ── */

			newChatBtn.addEventListener('click', function () {
				createConversation();
				closeSidebar();
			});

			/* ── Search ── */

			searchInput.addEventListener('input', function () {
				renderConvList(searchInput.value);
			});

			/* ── Helpers ── */

			function scrollToBottom() {
				requestAnimationFrame(function () {
					chatArea.scrollTop = chatArea.scrollHeight;
				});
			}

			function addMessage(role, content) {
				welcome.classList.add('hidden');
				var el = document.createElement('div');
				el.className = 'message ' + role;
				el.textContent = content;
				chatArea.insertBefore(el, typing);
				scrollToBottom();

				// Persist
				var conv = getConversation(activeConvId);
				if (conv) {
					conv.messages.push({
						role: role,
						content: content,
						timestamp: new Date().toISOString()
					});
					conv.updatedAt = Date.now();

					// Auto-title from first user message
					if (role === 'user' && conv.messages.length === 1) {
						conv.title = content.slice(0, 40) +
							(content.length > 40 ? '...' : '');
						mainTitle.textContent = conv.title;
					}
					saveConversations(conversations);
					renderConvList(searchInput.value);
				}

				return el;
			}

			function showTyping() {
				typing.classList.add('visible');
				scrollToBottom();
			}

			function hideTyping() {
				typing.classList.remove('visible');
			}

			function setProcessing(on) {
				isProcessing = on;
				input.disabled = on;
				micBtn.disabled = on;
			}

			/* ── Send button visibility ── */

			input.addEventListener('input', function () {
				sendBtn.classList.toggle('visible', input.value.trim().length > 0);
			});

			/* ── Submit ── */

			async function submitQuestion(question) {
				question = (question || '').trim();
				if (!question || isProcessing) return;

				// Ensure we have an active conversation
				if (!activeConvId) createConversation();

				addMessage('user', question);
				input.value = '';
				sendBtn.classList.remove('visible');
				setProcessing(true);
				showTyping();

				try {
					var res = await fetch('/process_question', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
							'X-Requested-With': 'AkandeApp'
						},
						body: JSON.stringify({ question: question })
					});
					var data = await res.json();
					hideTyping();
					if (res.ok && data.response) {
						addMessage('assistant', data.response);
					} else {
						addMessage('error', data.error || 'Something went wrong.');
					}
				} catch (_) {
					hideTyping();
					addMessage('error', 'Unable to connect. Check your network.');
				} finally {
					setProcessing(false);
					input.focus();
				}
			}

			input.addEventListener('keydown', function (e) {
				if (e.key === 'Enter' && !e.shiftKey) {
					e.preventDefault();
					submitQuestion(input.value);
				}
			});

			sendBtn.addEventListener('click', function () {
				submitQuestion(input.value);
			});

			/* ── Voice ── */

			function isSafari() {
				var ua = navigator.userAgent.toLowerCase();
				return ua.includes('safari') && !ua.includes('chrome');
			}

			function setRecordingUI(on) {
				micBtn.classList.toggle('recording', on);
				micBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
				micBtn.setAttribute('aria-label',
					on ? 'Stop recording' : 'Record voice question');
			}

			async function startRecording() {
				if (isProcessing) return;
				try {
					audioStream = await navigator.mediaDevices.getUserMedia({
						audio: true
					});
				} catch (_) {
					addMessage('error', 'Microphone access denied.');
					return;
				}

				var mime = isSafari() ? 'audio/mp4' : 'audio/webm';
				try {
					mediaRecorder = new MediaRecorder(audioStream, { mimeType: mime });
				} catch (_) {
					audioStream.getTracks().forEach(function (t) { t.stop(); });
					addMessage('error', 'Audio recording is not supported.');
					return;
				}

				var chunks = [];

				mediaRecorder.addEventListener('dataavailable', function (e) {
					if (e.data && e.data.size) chunks.push(e.data);
				});

				mediaRecorder.addEventListener('stop', async function () {
					clearTimeout(recordTimer);
					setRecordingUI(false);
					audioStream.getTracks().forEach(function (t) { t.stop(); });
					mediaRecorder = null;
					audioStream = null;

					if (!chunks.length) return;

					if (!activeConvId) createConversation();

					setProcessing(true);
					showTyping();

					try {
						var blob = new Blob(chunks, { type: mime });
						var res = await fetch('/process_audio_question', {
							method: 'POST',
							headers: {
								'Content-Type': mime,
								'X-Requested-With': 'AkandeApp'
							},
							body: blob
						});
						var data = await res.json();
						hideTyping();
						if (res.ok && data.response) {
							addMessage('assistant', data.response);
						} else {
							addMessage('error', data.error || 'Audio processing failed.');
						}
					} catch (_) {
						hideTyping();
						addMessage('error', 'Unable to connect. Check your network.');
					} finally {
						setProcessing(false);
						input.focus();
					}
				});

				mediaRecorder.start();
				setRecordingUI(true);

				recordTimer = setTimeout(function () {
					if (mediaRecorder && mediaRecorder.state === 'recording') {
						mediaRecorder.stop();
					}
				}, RECORD_MAX * 1000);
			}

			function stopRecording() {
				clearTimeout(recordTimer);
				if (mediaRecorder && mediaRecorder.state === 'recording') {
					mediaRecorder.stop();
				}
			}

			micBtn.addEventListener('click', function () {
				if (mediaRecorder && mediaRecorder.state === 'recording') {
					stopRecording();
				} else {
					startRecording();
				}
			});

			/* ── Export ── */

			/* ── Export modal with focus trap ── */

			var _exportReturnFocus = null;

			function openExportModal() {
				var conv = getConversation(activeConvId);
				if (!conv || !conv.messages.length) return;
				_exportReturnFocus = document.activeElement;
				exportModal.classList.add('visible');
				exportPdf.focus();
			}

			function closeExportModal() {
				exportModal.classList.remove('visible');
				if (_exportReturnFocus) {
					_exportReturnFocus.focus();
					_exportReturnFocus = null;
				}
			}

			function trapModalFocus(e) {
				if (e.key !== 'Tab') return;
				var focusable = exportModal.querySelectorAll('button');
				var first = focusable[0];
				var last = focusable[focusable.length - 1];
				if (e.shiftKey) {
					if (document.activeElement === first) {
						e.preventDefault();
						last.focus();
					}
				} else {
					if (document.activeElement === last) {
						e.preventDefault();
						first.focus();
					}
				}
			}

			exportModal.addEventListener('keydown', trapModalFocus);

			exportBtn.addEventListener('click', function () {
				openExportModal();
			});

			exportCancel.addEventListener('click', function () {
				closeExportModal();
			});

			exportModal.addEventListener('click', function (e) {
				if (e.target === exportModal) {
					closeExportModal();
				}
			});

			async function doExport(fmt) {
				var conv = getConversation(activeConvId);
				if (!conv) return;
				closeExportModal();

				try {
					var res = await fetch('/export_conversation', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
							'X-Requested-With': 'AkandeApp'
						},
						body: JSON.stringify({
							format: fmt,
							title: conv.title,
							messages: conv.messages
						})
					});

					if (!res.ok) {
						var err = await res.json();
						addMessage('error', err.error || 'Export failed.');
						return;
					}

					var blob = await res.blob();
					var ext = fmt === 'pdf' ? '.pdf' : '.csv';
					var filename = 'Akande_' + conv.title.replace(/[^a-zA-Z0-9]/g, '_') + ext;
					var url = URL.createObjectURL(blob);
					var a = document.createElement('a');
					a.href = url;
					a.download = filename;
					document.body.appendChild(a);
					a.click();
					a.remove();
					URL.revokeObjectURL(url);
				} catch (_) {
					addMessage('error', 'Export failed. Check your connection.');
				}
			}

			exportPdf.addEventListener('click', function () { doExport('pdf'); });
			exportCsv.addEventListener('click', function () { doExport('csv'); });

			/* ── Context menu ── */

			var _ctxReturnFocus = null;

			function showContextMenu(e, convId) {
				ctxConvId = convId;
				_ctxReturnFocus = document.activeElement;
				// Show off-screen first to measure
				contextMenu.style.top = '0px';
				contextMenu.style.left = '0px';
				contextMenu.classList.add('visible');
				var rect = contextMenu.getBoundingClientRect();
				var vw = window.innerWidth;
				var vh = window.innerHeight;
				var x = e.clientX;
				var y = e.clientY;
				// Clamp so the menu stays within the viewport
				if (x + rect.width > vw) x = vw - rect.width - 8;
				if (y + rect.height > vh) y = vh - rect.height - 8;
				if (x < 8) x = 8;
				if (y < 8) y = 8;
				contextMenu.style.top = y + 'px';
				contextMenu.style.left = x + 'px';
				contextMenu.querySelector('button').focus();
			}

			function hideContextMenu() {
				contextMenu.classList.remove('visible');
				ctxConvId = null;
				if (_ctxReturnFocus) {
					_ctxReturnFocus.focus();
					_ctxReturnFocus = null;
				}
			}

			// Arrow key navigation inside context menu
			contextMenu.addEventListener('keydown', function (e) {
				var items = contextMenu.querySelectorAll('button');
				var idx = Array.prototype.indexOf.call(items, document.activeElement);
				if (e.key === 'ArrowDown') {
					e.preventDefault();
					items[(idx + 1) % items.length].focus();
				} else if (e.key === 'ArrowUp') {
					e.preventDefault();
					items[(idx - 1 + items.length) % items.length].focus();
				} else if (e.key === 'Tab') {
					e.preventDefault();
					hideContextMenu();
				}
			});

			document.addEventListener('click', function () {
				hideContextMenu();
			});

			ctxRename.addEventListener('click', function () {
				if (ctxConvId) renameConversation(ctxConvId);
				hideContextMenu();
			});

			ctxExport.addEventListener('click', function () {
				if (ctxConvId) {
					switchConversation(ctxConvId);
					openExportModal();
				}
				hideContextMenu();
			});

			ctxDelete.addEventListener('click', function () {
				if (ctxConvId && confirm('Delete this conversation?')) {
					deleteConversation(ctxConvId);
				}
				hideContextMenu();
			});

			/* ── More button (header) ── */

			moreBtn.addEventListener('click', function (e) {
				e.stopPropagation();
				if (activeConvId) {
					showContextMenu(e, activeConvId);
				}
			});

			/* ── Keyboard shortcuts ── */

			document.addEventListener('keydown', function (e) {
				// Escape: close modals/menus/recording
				if (e.key === 'Escape') {
					if (exportModal.classList.contains('visible')) {
						closeExportModal();
					} else if (contextMenu.classList.contains('visible')) {
						hideContextMenu();
					} else if (mediaRecorder && mediaRecorder.state === 'recording') {
						stopRecording();
					} else if (sidebar.classList.contains('open')) {
						closeSidebar();
					}
				}

				// Ctrl/Cmd + N: new conversation
				if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
					e.preventDefault();
					createConversation();
				}

				// Ctrl/Cmd + K: focus search
				if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
					e.preventDefault();
					if (window.innerWidth <= 768) openSidebar();
					searchInput.focus();
				}
			});

		})();
	</script>
