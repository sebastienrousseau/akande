name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Python CI
    uses: sebastienrousseau/pipelines/.github/workflows/python-ci.yml@main
    with:
      python-version: '3.11'
      run-ruff: true
      run-mypy: true
      # Ratcheted back up to 60 % in v0.0.6-dev.3 — the Track E
      # modules (profiles, disclosure, safety, audit, cli/data) ship
      # with focused tests that lifted coverage from 56.68 % to
      # 60.23 %.  Next step toward 75 % by GA: a dedicated TUI-tests
      # sub-track to attack akande/tui.py (currently 14 %).
      coverage-threshold: 60
      package-manager: 'pip'
    secrets: inherit
