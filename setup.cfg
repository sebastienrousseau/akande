[flake8]
exclude = .venv,venv,build,dist,*.egg-info
max-line-length = 79
# E203 (whitespace before ':') fires on black's slice spacing —
# `x[len(p) :]` — which PEP 8 explicitly permits. black and flake8
# disagree here; black wins.
extend-ignore = E203

[aliases]
test = pytest

[tool:pytest]
testpaths = tests

[wheel]
universal = 0
