name: CI

on:
  push:
    branches: [main, "feat/**", "chores/**"]
  pull_request:
    branches: [main, "feat/**", "chores/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  ci:
    name: Python CI
    uses: sebastienrousseau/pipelines/.github/workflows/python-ci.yml@7061363af0a1da9d60c5901bd2874ac83ff7e34e # main
    with:
      # `python-version` drives the lint + mypy step (single pin).
      # `python-versions` drives the test matrix: the full
      # requires-python = ">=3.11" range (3.11 since pillow 13.0.0)
      # plus the two newest releases.  Lets us drop the python-
      # major Dependabot ignore once 3.13/3.14 stay green here.
      python-version: '3.11'
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      run-ruff: true
      run-mypy: true
      coverage-threshold: 95
      package-manager: 'pip'
    secrets: inherit

  ci-all:
    # Branch protection requires this check by name. It stands for every
    # leg of the ci matrix, so adding or dropping a version never
    # renames a required check.
    name: Python CI (all)
    if: always()
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every leg of the matrix passed
        env:
          RESULT: ${{ needs.ci.result }}
        run: test "$RESULT" = success
