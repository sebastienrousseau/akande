name: regression

on:
  push:
    branches: [main, "feat/**", "chores/**"]
  pull_request:
    branches: [main, "feat/**", "chores/**"]
  schedule:
    # Daily at 04:11 UTC to catch upstream breakage early.
    - cron: "11 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  fresh-install:
    name: Fresh install - Py ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full requires-python = ">=3.11" range on Linux + macOS
        # rows so PortAudio / PulseAudio surprises surface.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-latest"]
        include:
          - python-version: "3.12"
            os: "macos-14"
          - python-version: "3.14"
            os: "macos-14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ❯ Set up Python ${{ matrix.python-version }} 🐍
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: ❯ Install system audio dependencies (Ubuntu) 🛠️
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-all-dev ffmpeg

      - name: ❯ Install system audio dependencies (macOS) 🛠️
        if: runner.os == 'macOS'
        run: |
          brew install portaudio ffmpeg

      - name: ❯ Run fresh-install regression 🔄
        run: ./scripts/regression.sh --keep-venv

      - name: ❯ Upload regression logs on failure 📤
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-logs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .regression-logs/
          if-no-files-found: ignore
