[mypy]
python_version = 3.10
ignore_missing_imports = True
follow_imports = silent
warn_redundant_casts = True
warn_unused_ignores = False
no_implicit_optional = True
check_untyped_defs = False
show_error_codes = True
pretty = True
exclude = (?x)(
      ^build/
    | ^dist/
    | ^public/
    | ^tests/
  )

# Strict islands: modules we want fully typed today.
[mypy-akande.providers.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_unused_ignores = True

[mypy-akande.cache]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_unused_ignores = True

[mypy-akande.budgets]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_unused_ignores = True

[mypy-akande.exceptions]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_unused_ignores = True

# Third-party packages without type stubs we explicitly ignore.
[mypy-cherrypy.*]
ignore_missing_imports = True

[mypy-pydub.*]
ignore_missing_imports = True

[mypy-speech_recognition.*]
ignore_missing_imports = True

[mypy-gtts.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-textual.*]
ignore_missing_imports = True

[mypy-pyttsx4.*]
ignore_missing_imports = True
