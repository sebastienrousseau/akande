name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Python CI
    uses: sebastienrousseau/pipelines/.github/workflows/python-ci.yml@main
    with:
      python-version: '3.11'
      run-ruff: true
      run-mypy: true
      # Ratcheted to 63 % in v0.0.6-dev.8 — Track D skills (skill
      # protocol, policy, four starter skills, CLI) ship with 41
      # focused tests that lifted coverage from 61.52 % to 63.63 %.
      # Next step toward 75 % by GA: a dedicated TUI-tests sub-track
      # to attack akande/tui.py (currently 14 %).
      coverage-threshold: 63
      package-manager: 'pip'
    secrets: inherit
